<style>
:root { color-scheme:light; --ink:#17222a; --muted:#66747a; --ghost:#87929a; --bg:#f4f5f1; --paper:#fff; --line:#e6e9e5; --lime:#d8fc7a; --green:#42785c; --sky:#e9f0ff; --blue:#5577bd; --radius:22px; }
*{box-sizing:border-box}

a{color:inherit}button{font:inherit}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

.brand{display:flex;align-items:center;gap:9px;font-weight:850;letter-spacing:-.025em;text-decoration:none;font-size:15px;white-space:nowrap}.brandlogo{width:37px;height:37px;display:grid;place-items:center;background:var(--ink);color:var(--lime);border-radius:12px;font-weight:950;letter-spacing:-.09em;font-size:14px}.brand small{font-size:10px;color:#74828b;font-weight:700;margin-left:4px;letter-spacing:.06em}
.sync{display:flex;align-items:center;gap:7px;font-size:11px;color:#65757d;background:#fff;border:1px solid var(--line);border-radius:25px;padding:8px 11px;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:#76b98c}
.hero{background:#16222b;color:white;border-radius:28px;padding:34px 37px 32px;overflow:hidden;position:relative;isolation:isolate}
.hero:before{content:'';position:absolute;inset:-75px -160px 0 auto;width:475px;height:350px;transform:rotate(-20deg);border-radius:45%;background:radial-gradient(ellipse at center,#94c96933,transparent 63%);z-index:-1}
.over{color:var(--lime);font-size:10px;font-weight:850;letter-spacing:.19em;text-transform:uppercase}
.hero-grid{display:grid;grid-template-columns:1fr auto;align-items:end;gap:20px}.hero h1{font-size:clamp(31px,5vw,53px);letter-spacing:-.065em;line-height:1.08;margin:15px 0 11px;font-weight:900}.hero p{font-size:13px;color:#b7c5cb;margin:0;max-width:470px}.count{display:flex;align-items:baseline;gap:7px}.count strong{font-size:clamp(54px,7vw,89px);font-weight:920;letter-spacing:-.095em;color:var(--lime);line-height:.95}.count span{font-size:10px;color:#ccd4da;line-height:1.5;font-weight:800;letter-spacing:.05em}
.races{display:flex;gap:9px;margin-top:28px;flex-wrap:wrap}.race{flex:0 1 240px;background:#ffffff0a;border:1px solid #53626b;border-radius:12px;padding:11px 13px}.race b{font-size:12px;display:block}.race span{font-size:11px;color:#aebdc6}
.nav{display:flex;gap:7px;padding:13px 0 2px;position:sticky;top:0;background:var(--bg);z-index:10;overflow:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav a{border:1px solid var(--line);background:#fff;text-decoration:none;border-radius:30px;padding:9px 17px;white-space:nowrap;font-weight:750;color:#5c6a70;font-size:12px}.nav a:active{background:var(--lime)}
main{padding-bottom:56px}.section{padding-top:46px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:17px}.eyebrow{font-size:10px;letter-spacing:.18em;font-weight:850;color:#859394;text-transform:uppercase;margin-bottom:6px}.section h2{margin:0;font-size:clamp(22px,3.2vw,31px);font-weight:880;letter-spacing:-.045em;line-height:1.15}.aside{color:#819093;font-size:11px;max-width:280px;text-align:right}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:17px 18px}.kpi.strong{background:var(--lime);border-color:var(--lime)}.kpi .label{color:#6e7c7d;font-size:11px;font-weight:700}.kpi.strong .label{color:#50653b}.kpi b{display:block;font-size:clamp(28px,3.8vw,38px);line-height:1.1;letter-spacing:-.06em;margin:10px 0 6px;font-variant-numeric:tabular-nums}.kpi b small{font-size:13px;letter-spacing:0}.kpi .detail{font-size:10px;color:#78868c}.kpi.strong .detail{color:#546940}
.charts{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:11px;margin-top:11px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px 23px;min-width:0}.card-title{font-size:14px;font-weight:840;letter-spacing:-.02em}.card-sub{font-size:11px;color:var(--muted);margin-top:3px}.bars{display:flex;align-items:flex-end;gap:8px;margin-top:24px;padding:0 2px 21px;height:171px;border-bottom:1px solid #e7eae7}.bar-col{flex:1;min-width:0;display:flex;align-items:center;flex-direction:column;justify-content:flex-end;height:100%;gap:6px;position:relative}.bar-num{font-size:10px;color:#677679;font-variant-numeric:tabular-nums}.bar{width:min(28px,76%);background:#dce6d8;border-radius:6px 6px 2px 2px;min-height:4px}.bar.marked{background:#577f6b}.bar-label{position:absolute;top:calc(100% + 6px);font-size:10px;white-space:nowrap;color:#7a8589}.footnote{font-size:10px;color:#7b8687;line-height:1.6;margin:30px 0 0}.interval{margin-top:24px}.interval+.interval{margin-top:19px}.int-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12px}.int-top b{font-weight:800}.int-top strong{font-size:20px;letter-spacing:-.045em}.track{height:10px;background:#ecf0ec;overflow:hidden;border-radius:20px;margin-top:9px}.progress{height:100%;border-radius:20px;background:#b6cbc1}.progress.latest{background:#5578c5}.int-hint{font-size:10px;color:#788589;margin-top:7px}
.coach{margin-top:12px;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr);gap:11px}.coach-lead{border-radius:20px;background:var(--ink);color:#fff;padding:27px}.coach-lead .spark{height:37px;width:37px;display:grid;place-items:center;background:var(--lime);color:var(--ink);border-radius:13px;font-weight:900}.coach-lead h3{font-size:25px;letter-spacing:-.05em;line-height:1.18;margin:28px 0 13px}.coach-lead p{font-size:12px;color:#bdc9c9;margin:0}.coach-notes{border:1px solid var(--line);border-radius:20px;background:#fff;padding:11px 21px}.finding{display:flex;gap:13px;padding:15px 0}.finding+.finding{border-top:1px solid #eef0ee}.finding .num{font-weight:860;color:#8b9899;font-size:12px;padding-top:2px}.finding strong{font-size:13px;display:block}.finding p{font-size:12px;color:#67757a;line-height:1.6;margin:5px 0 0}
.evidence{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.evidence article{border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px}.evidence small{color:#79868b;font-size:10px}.evidence b{display:block;font-weight:900;font-size:23px;letter-spacing:-.04em;margin:4px 0 3px}.evidence strong{display:block;font-size:11px}.evidence p{font-size:10px;color:#718080;margin:5px 0 0}
.week-switch{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:2px 0 14px;padding:3px 1px}.week-switch::-webkit-scrollbar{display:none}.week-btn{flex:1;min-width:130px;cursor:pointer;border:1px solid #dce1dd;border-radius:14px;background:#fff;text-align:left;padding:12px 14px;color:var(--ink)}.week-btn.selected{background:var(--ink);color:#fff;border-color:var(--ink)}.week-btn b{display:block;font-size:12px}.week-btn span{font-size:10px;color:#84908f}.week-btn.selected span{color:#bdc9c5}
.plan-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:23px}.plan-header{display:flex;align-items:start;justify-content:space-between;gap:14px;border-bottom:1px solid #e9ece8;padding-bottom:15px}.plan-title{font-size:19px;letter-spacing:-.04em;font-weight:850}.plan-dates{font-size:11px;color:#849192}.plan-badge{border-radius:40px;background:var(--lime);padding:7px 12px;white-space:nowrap;font-size:12px;font-weight:850}.plan-focus{font-size:12px;color:#647579;margin:11px 0 12px}.days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}.session{display:grid;grid-template-columns:39px 1fr;gap:10px;padding:13px 0;border-bottom:1px solid #eff1ed}.session .dow{font-size:11px;color:#8a9696;font-weight:850;padding-top:2px}.session-title{font-size:13px;font-weight:830}.session-desc{font-size:11px;color:#6d7b80;margin:4px 0 0;line-height:1.62}.session-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:780;letter-spacing:.01em;margin-bottom:3px;color:#496d5e}.session-tag.run{color:#4d6cb3}.session-tag.rest{color:#97a19d}.session-tag.conditional{color:#9b7135}.session-tag.strength{color:#447452}.session-tag.skill{color:#6a82aa}
.plan-rule{background:#edf3e9;color:#45644b;border:1px solid #dbe8d3;border-radius:14px;padding:14px 17px;font-size:12px;margin-top:15px}
.stations{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.station{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.station h3{font-size:14px;margin:4px 0 7px;letter-spacing:-.035em}.station b{font-size:23px;font-weight:900;line-height:1}.station small{font-size:10px;color:#82908a}.station summary{cursor:pointer;font-size:11px;color:#63747b;font-weight:700;margin-top:7px}.station ul{padding-left:14px;font-size:11px;color:#68777c;line-height:1.75;margin:9px 0 0}
.timeline{background:#fff;border:1px solid var(--line);border-radius:19px;padding:10px 23px}.phase{display:grid;grid-template-columns:94px 1fr;gap:15px;padding:18px 0}.phase+.phase{border-top:1px solid #ecf0ea}.phase time{font-size:11px;font-weight:840}.phase .phase-tag{color:#8a989b;font-size:10px;font-weight:800;letter-spacing:.11em}.phase h3{font-size:15px;margin:3px 0;font-weight:850;letter-spacing:-.025em}.phase p{margin:0;font-size:11px;color:#6a7a7e;line-height:1.65}.limit{padding:22px 0 28px;color:#778489;font-size:11px}.footer{margin-top:43px;border-top:1px solid #dde2df;color:#7b898d;font-size:11px;padding:23px 0 95px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}.footer a{color:#5b6f78;text-underline-offset:2px}
.mobile-nav{display:none;position:fixed;z-index:20;bottom:0;left:0;right:0;background:#fbfcf9f2;border-top:1px solid #e0e6e1;backdrop-filter:blur(15px);padding:8px max(15px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom)) max(15px,env(safe-area-inset-right));gap:8px}.mobile-nav a{flex:1;display:grid;place-items:center;text-decoration:none;color:#62747a;font-size:10px;font-weight:800;padding:4px}.mobile-nav svg{width:19px;height:19px;display:block;margin-bottom:3px}
.state{padding:32px 12px;font-size:13px;color:#697a80}.state.error{background:#fff1e9;border-radius:15px;margin-top:20px}
@media(max-width:810px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.charts,.coach{grid-template-columns:1fr}.evidence{grid-template-columns:repeat(2,1fr)}.stations{grid-template-columns:1fr}}
@media(max-width:600px){.shell{width:calc(100% - 28px)}.top{min-height:63px}.brand{font-size:13px}.brand small{font-size:9px}.brandlogo{width:33px;height:33px}.sync{font-size:10px;padding:7px 9px}.hero{padding:27px 23px;border-radius:22px}.hero-grid{grid-template-columns:1fr auto;align-items:center;gap:4px}.hero h1{font-size:34px;margin:14px 0 9px}.hero p{font-size:11px;max-width:230px}.count strong{font-size:50px}.count span{font-size:9px}.count{flex-direction:column;gap:0;text-align:right}.races{margin-top:25px;gap:7px}.race{padding:9px 10px;min-width:0;flex:1}.race b{font-size:11px}.race span{font-size:9px}.nav{display:none}.section{padding-top:36px}.section-head{margin-bottom:14px}.aside{display:none}.kpis{gap:8px}.kpi{padding:14px;border-radius:15px}.kpi b{font-size:32px}.card{padding:18px}.bars{gap:5px}.bar-label{font-size:9px}.coach-lead{padding:22px;min-height:0}.coach-lead h3{font-size:23px;margin:18px 0 10px}.coach-notes{padding:7px 18px}.evidence article{padding:12px}.evidence b{font-size:22px}.week-btn{min-width:127px}.plan-card{padding:17px}.plan-title{font-size:17px}.plan-badge{font-size:10px;padding:7px 10px}.days{grid-template-columns:1fr}.session{padding:12px 0}.phase{grid-template-columns:73px 1fr;gap:13px}.timeline{padding:9px 16px}.mobile-nav{display:flex}.footer{padding-bottom:100px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<body>
<div class="shell">
<header class="top"><a class="brand" href="#top"><span class="brandlogo">HX</span><span>HYROX LAB<small> / ALVIN</small></span></a><span class="sync"><i class="dot"></i><span id="sync-label">讀取訓練紀錄中</span></span></header>
<main id="top"><section class="hero"><div class="over">PERFORMANCE / TAIPEI 2027</div><div class="hero-grid"><div><h1>練得更強。<br>比得更穩。</h1><p>週五和 Stacy 混雙，週六 Men's Open。目標：第二場穩穩完賽。</p></div><div class="count"><strong id="countdown">—</strong><span>DAYS<br>TO RACE</span></div></div><div class="races"><div class="race"><b>03.12 · FRIDAY</b><span>Mixed Doubles</span></div><div class="race"><b>03.13 · SATURDAY</b><span>Men's Open · 穩定完賽</span></div></div></section>
<nav class="nav" aria-label="報告導覽"><a href="#review">數據回顧</a><a href="#coach">教練分析</a><a href="#plan">接下來四週</a><a href="#future">直到比賽</a></nav>
<div id="content" class="state">正在載入最新訓練分析…</div></main></div>
<nav class="mobile-nav" aria-label="手機導覽"><a href="#review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17h18M5 14l4-5 4 3 6-7"/></svg>回顧</a><a href="#coach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 3 6 6 3-6 3-3 6-3-6-6-3 6-3z"/></svg>AI分析</a><a href="#plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18"/></svg>課表</a><a href="#future"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 20c5-7 8-4 11-11s6-5 7-6M15 3h6v6"/></svg>賽前</a></nav>
<script>
'use strict';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kindName={strength:'力量',skill:'技巧',run:'品質跑',easy:'Easy',rest:'休息',conditional:'彈性'};
function timeStr(sec){let s=Math.round(Number(sec));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function countdown(){let t=new Date('2027-03-13T00:00:00+08:00').getTime();return Math.max(0,Math.ceil((t-Date.now())/86400000))}
document.getElementById('countdown').textContent=countdown();
function weeklyChart(weeks){const max=Math.max(22,...weeks.map(x=>Number(x.km)));return `<div class="bars">${weeks.map((w,i)=>`<div class="bar-col"><span class="bar-num">${Number(w.km).toFixed(1)}</span><div class="bar ${i===weeks.length-1?'marked':''}" style="height:${Math.max(5,Math.round(Number(w.km)/max*116))}px"></div><span class="bar-label">${E(w.w)}</span></div>`).join('')}</div>`}
function dayRow(x){const k=x[3]||'skill';return `<article class="session"><span class="dow">${E(x[0])}</span><div><span class="session-tag ${E(k)}">● ${E(kindName[k]||k)}</span><div class="session-title">${E(x[1])}</div><p class="session-desc">${E(x[2])}</p></div></article>`}
function renderWeek(d,index){const w=d.weeks[index];const mount=document.getElementById('selected-week');if(!mount||!w)return;mount.innerHTML=`<div class="plan-header"><div><div class="plan-title">${E(w.tag)}</div><div class="plan-dates">${E(w.dates)}</div></div><span class="plan-badge">${E(w.km)}</span></div><p class="plan-focus">${E(w.focus)}</p><div class="days">${w.days.map(dayRow).join('')}</div><div class="plan-rule"><strong>訓練調整優先序：</strong>週三 Petra 高強度 WOD 與週四 Interval 二選一；下肢疲勞高時，週日硬拉減量或改背部／休息。</div>`;document.querySelectorAll('[data-week]').forEach(btn=>{btn.classList.toggle('selected',Number(btn.dataset.week)===index);btn.setAttribute('aria-pressed',String(Number(btn.dataset.week)===index));});}
function render(d){const s=d.metrics||{};document.getElementById('sync-label').textContent='資料截至 '+String(d.dataThrough||d.updated||'—');const weekKm=Number(s.recentWeekKm||0).toFixed(1);const content=document.getElementById('content');content.className='';content.innerHTML=`
<section class="section" id="review"><div class="section-head"><div><div class="eyebrow">01 · PERFORMANCE REVIEW</div><h2>這段時間，練得如何？</h2></div><span class="aside">Garmin API ＋ Petra 白板交叉比對</span></div>
<div class="kpis"><article class="kpi strong"><span class="label">最新週跑量</span><b>${weekKm}<small> km</small></b><span class="detail">包含熱身、間歇及 Easy Run</span></article><article class="kpi"><span class="label">累積跑量</span><b>${Number(s.totalKm||0).toFixed(1)}<small> km</small></b><span class="detail">Garmin ${E(s.runs)} 筆跑步</span></article><article class="kpi"><span class="label">最近 400m 平均</span><b>${timeStr(s.intervalAvgSeconds||0)}</b><span class="detail">11/05 · 8 趟工作段</span></article><article class="kpi"><span class="label">1500m Row</span><b>${E(s.row1500)}</b><span class="detail">Garmin 成績 · 白板 ${E(s.row1500Photo)}</span></article></div>
<div class="charts"><article class="card"><div class="card-title">每週跑量</div><div class="card-sub">KM / Garmin 實際跑步，WOD 不重複計算</div>${weeklyChart(d.weeklyKm||[])}<p class="footnote">首末週可能不完整。提升耐力時先看三週趨勢，不追單週極高跑量。</p></article>
<article class="card"><div class="card-title">400m 間歇能力</div><div class="card-sub">FIT 逐圈分析；兩堂訓練的趟數不同</div>${(d.intervals||[]).map((x,i)=>`<div class="interval"><div class="int-top"><b>${E(x.date)} · ${E(x.reps)} 趟</b><strong>${timeStr(x.avgSec)}</strong></div><div class="track"><div class="progress ${i===d.intervals.length-1?'latest':''}" style="width:${Math.round(82*Number(x.avgSec)/125)}%"></div></div><p class="int-hint">每 400m 平均工作時間 · 平均 HR ${E(x.avgHr)} bpm</p></div>`).join('')}<p class="footnote">速度較快不代表整體耐力已提升；仍須觀察連續跑與運動後恢復。</p></article></div>
</section>
<section class="section" id="coach"><div class="section-head"><div><div class="eyebrow">02 · COACH'S VIEW</div><h2>AI 教練：本週重點</h2></div></div><div class="coach"><div class="coach-lead"><span class="spark">✦</span><h3>${E(d.coach?.headline)}</h3><p>${E(d.coach?.summary)}</p></div><div class="coach-notes">${(d.coach?.findings||[]).map((x,i)=>`<article class="finding"><span class="num">0${i+1}</span><div><strong>${E(x.title)}</strong><p>${E(x.body)}</p></div></article>`).join('')}</div></div>
<div class="evidence">${(d.petra||[]).slice(0,4).map(x=>`<article><small>${E(x.date)}</small><b>${E(x.score)}</b><strong>${E(x.name)}</strong><p>${E(x.detail).slice(0,115)}${String(x.detail).length>115?'…':''}</p></article>`).join('')}</div><p class="limit">${E(d.coach?.limitation)}</p></section>
<section class="section" id="plan"><div class="section-head"><div><div class="eyebrow">03 · NEXT 4 WEEKS</div><h2>打開就知道接下來練什麼。</h2></div></div><div class="week-switch" aria-label="週次切換">${(d.weeks||[]).map((w,i)=>`<button type="button" class="week-btn" data-week="${i}" aria-pressed="false"><b>${E(w.week)} · ${E(w.tag)}</b><span>${E(w.dates)}</span></button>`).join('')}</div><div id="selected-week" class="plan-card" aria-live="polite"></div>
<div class="section-head" style="margin:27px 0 5px"><div><div class="eyebrow">STRENGTH REFERENCE</div><h2 style="font-size:18px">World Gym 三大項</h2></div></div><div class="stations">${(d.lifts||[]).map(l=>`<details class="station"><div><small>SESSION ${E(l.id)}</small></div><h3>${E(l.name)}</h3><summary>查看完整組數與動作</summary><ul>${l.movements.map(m=>`<li>${E(m)}</li>`).join('')}</ul></details>`).join('')}</div></section>
<section class="section" id="future"><div class="section-head"><div><div class="eyebrow">04 · RACE ROADMAP</div><h2>從現在，到第二場終點。</h2></div></div><div class="timeline">${(d.phases||[]).map(p=>`<article class="phase"><time>${E(p.dates)}</time><div><span class="phase-tag">${E(p.label)}</span><h3>${E(p.head)}</h3><p>${E(p.detail)}</p></div></article>`).join('')}</div><p class="limit">課表每週依 Garmin 與 Petra 新資料微調。若疼痛、心率異常、睡眠不足或連續疲勞，應優先減量。賽程與起跑時間以官方公告為準。</p></section>
<footer class="footer"><span>HYROX LAB · ALVIN · 更新 ${E(d.updated)}<br>${E(d.privacy)}</span><span><a href="https://hyrox.com/event/hyrox-taipei/" target="_blank" rel="noopener">HYROX 官方賽程</a> · <a href="https://github.com/alvinxyyzzz/HyroxTrainingPlan" target="_blank" rel="noopener">GitHub</a></span></footer>`;
const today=new Date();const idx=(d.weeks||[]).findIndex(w=>{let p=String(w.dates).match(/(\d\d)\/(\d\d)/);if(!p)return false;const start=new Date(Number(d.updated.slice(0,4)),+p[1]-1,+p[2]);const end=new Date(start);end.setDate(start.getDate()+7);return today>=start&&today<end});renderWeek(d,idx>=0?idx:0);document.querySelectorAll('[data-week]').forEach(b=>b.addEventListener('click',()=>renderWeek(d,Number(b.dataset.week))));}
fetch('./data/report.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Report HTTP '+r.status);return r.json()}).then(render).catch(err=>{console.error(err);let c=document.getElementById('content');c.className='state error';c.innerHTML='訓練報告目前無法載入。請確認網路，或重新開啟 App。';});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Offline unavailable',err)));}
</script>
</body>
</html>
