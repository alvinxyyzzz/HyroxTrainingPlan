document.addEventListener("change",async e=>{const t=e.target;if(t.id==="weekSelect"){state.selectedDay=undefined;state.week=Number(t.value);render();return}if(t.dataset.scheduleday!==undefined){const i=Number(t.dataset.scheduleday);save("v1_day_"+w().id+"_"+i,t.value);state.selectedDay=i;render();return}if(t.id==="privateImport"&&t.files?.[0]){try{const p=JSON.parse(await t.files[0].text());if(!validPrivate(p))throw Error("資料格式不符");save("hyrox_private_kpi_v1",JSON.stringify(p));render()}catch(err){alert("無法匯入："+err.message)}}});window.addEventListener("hashchange",()=>nav(location.hash.slice(1)));
async function get(path){const r=await fetch(path+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(path+" "+r.status);return r.json()}
async function load(){const paths=["./data/coaching-v156.json","./data/season-ui.json","./data/latest-garmin.json","./data/performance.json"];const r=await Promise.allSettled(paths.map(get));state.coach=r[0].status==="fulfilled"?r[0].value:null;state.plan=r[1].status==="fulfilled"?r[1].value:null;state.latest=r[2].status==="fulfilled"?r[2].value:null;state.performance=r[3].status==="fulfilled"?r[3].value:null;if(!Array.isArray(state.plan)||state.plan.length!==17){app.innerHTML=card("<h2>訓練週期暫時無法讀取</h2><p>請重新整理或確認網路。</p>");return}if(!state.coach?.weeks){state.error.push("詳細處方暫時無法讀取，請重新整理");app.innerHTML=card("<h2>詳細處方暫時無法讀取</h2><p>不使用過期課表替代。請重新整理。</p>");return}if(!state.latest)state.error.push("Garmin 摘要暫時不可用");state.today=today();state.week=current();if(state.plan[state.week]?.id==="W02"&&state.today===state.plan[state.week].end)state.week=Math.min(state.week+1,state.plan.length-1);$("#stamp").textContent="V1.0";nav(location.hash.slice(1))}
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js?v=101").catch(()=>{});load();
})();
</script></body></html>
