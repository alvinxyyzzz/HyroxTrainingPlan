<style>
:root{--ink:#192b2c;--muted:#667675;--pale:#f6f8f7;--line:#e4e9e7;--card:#fff;--accent:#d1f29b;--accentink:#213c2e;--dark:#183432;--mint:#75bca2;--cyan:#7bb8c4;--blue:#7e9ec5;--violet:#ae9dc8;--lime:#b8d780}
*{box-sizing:border-box}
html{scroll-behavior:smooth}body{margin:0;background:var(--pale);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang TC","Noto Sans TC",Arial,sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,select{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid #83b798;outline-offset:3px}
.shell{max-width:1080px;margin:auto;padding:0 32px}
header{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:50}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:72px;gap:15px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none}
.brand img{width:37px;height:37px;border-radius:11px}
.brand strong{display:block;font-size:15px;letter-spacing:-.055em;line-height:1.2}
.brand small{display:block;font-size:9px;color:#73847d;letter-spacing:.16em;font-weight:800;margin-top:4px}
nav{display:flex;align-items:center;gap:4px}
nav button{color:#61716c;background:transparent;border:0;padding:10px 15px;border-radius:100px;font-weight:750;font-size:12px}
nav button.active{background:#e7efea;color:#244335}
.chip{color:#677976;background:#f3f6f4;border-radius:100px;font-size:10px;padding:8px 11px;font-weight:700}
main{min-height:calc(100vh - 200px)}
.screen{display:none;padding:31px 0 85px}.screen.active{display:block}
.mini{font-size:10px;letter-spacing:.13em;font-weight:850;color:#618574;text-transform:uppercase}
.headline{font-size:clamp(32px,5vw,54px);line-height:1.08;letter-spacing:-.066em;margin:11px 0 13px;font-weight:850}
.lead{font-size:14px;color:#61726e;line-height:1.8;max-width:720px;margin:0}
.hero{background:var(--dark);color:#fff;border-radius:24px;padding:32px 34px;display:flex;align-items:end;justify-content:space-between;gap:30px;margin-bottom:25px}
.hero .mini{color:#b5e5bf}.hero h1{font-size:clamp(38px,5.7vw,64px);line-height:1.02;letter-spacing:-.077em;margin:14px 0}
.hero p{color:#c5d7d1;max-width:570px;line-height:1.8;margin:0}
.hero-side{flex:0 0 auto;text-align:right}
.hero-num{font-size:62px;letter-spacing:-.085em;font-weight:850;line-height:.9;color:#d0f39b}
.hero-side small{display:block;color:#c4d5d0;font-size:11px;letter-spacing:.09em;margin-top:12px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px}
.pill{font-size:11px;font-weight:750;color:#23433b;background:#e3f0e8;padding:8px 11px;border-radius:100px}
.pill.soft{background:#eff3f1;color:#637571}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:29px 0 15px}
.section-head h2{font-size:23px;letter-spacing:-.05em;margin:0}
.section-head p{font-size:11px;color:#81918d;margin:0}
.block-grid{display:grid;gap:14px}
.block{background:#fff;border:1px solid #e1e8e5;border-radius:19px;overflow:hidden}
.block-top{padding:23px 24px 16px;display:flex;gap:19px;align-items:start}
.block-mark{width:6px;min-height:68px;border-radius:99px;background:var(--blockcolor);flex-shrink:0}
.block-title{flex:1}.block-title span{color:#779188;font-size:10px;font-weight:900;letter-spacing:.12em}
.block-title h3{font-size:20px;letter-spacing:-.04em;margin:3px 0 6px}
.block-title p{margin:0;color:#6d7e7a;font-size:12px}
.block-goal{background:#f6f8f7;border-top:1px solid #edf1ef;padding:12px 24px;font-size:11px;color:#617470}
.week-list{padding:7px 13px 14px}
.week-row{display:flex;align-items:center;text-align:left;gap:12px;width:100%;border:0;background:transparent;padding:12px 11px;border-radius:11px;color:#243a37}
.week-row+ .week-row{border-top:1px solid #f0f3f1}
.week-row:hover,.week-row:focus-visible{background:#eef5ef}
.week-row .wk{font-size:12px;font-weight:900;color:#56766a;width:35px;flex-shrink:0}
.week-row .wr{flex:1;min-width:0}
.week-row b{display:block;font-size:13px;font-weight:800}
.week-row small{display:block;font-size:10px;color:#84938f;margin-top:2px}
.week-row .arrow{font-size:18px;color:#7b9285}
.roadmap-footer{margin-top:23px;padding:15px 18px;background:#edf2ef;border-radius:14px;color:#627770;font-size:11px;line-height:1.8}
.plan-heading{display:flex;align-items:center;gap:18px;justify-content:space-between;margin-bottom:18px}
.week-controls{display:flex;align-items:center;gap:7px}
.week-controls button{border:1px solid #dce6df;background:#fff;border-radius:11px;width:38px;height:38px;color:#2e5045;font-weight:850}
.week-controls button:disabled{opacity:.3;cursor:default}
.week-controls select{border:1px solid #dce6df;background:#fff;color:#274136;border-radius:10px;padding:9px;font-size:12px;font-weight:800;max-width:106px}
.week-hero{background:#fff;border:1px solid var(--line);border-radius:21px;padding:27px 29px}
.week-hero h1{margin:10px 0 6px;font-size:35px;line-height:1.16;letter-spacing:-.065em}
.week-hero p{color:#697a76;margin:8px 0;font-size:13px;line-height:1.75}
.week-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
.week-stat{background:#f0f4f1;border-radius:13px;padding:14px 16px}
.week-stat small{color:#6d8077;font-size:10px;font-weight:700;display:block}
.week-stat b{display:block;color:#273c32;font-size:12px;margin-top:6px;line-height:1.6}
.note{border-left:3px solid #a6c995;padding:11px 15px;background:#f4f7f4;color:#5b7468;font-size:12px;line-height:1.7;margin-top:15px;border-radius:0 10px 10px 0}
.mode-row{display:flex;align-items:center;gap:14px;justify-content:space-between;margin:28px 0 14px}
.mode-row h2{font-size:22px;letter-spacing:-.05em;margin:0}
.mode-select{display:flex;background:#e7eeea;padding:3px;border-radius:12px;flex-shrink:0}
.mode-select button{border:0;background:transparent;color:#667b71;border-radius:9px;padding:9px 13px;font-size:11px;font-weight:800}
.mode-select button.active{background:#fff;color:#214733;box-shadow:0 1px 3px #19271c16}
.session-list{display:grid;gap:10px}
.session{background:#fff;border:1px solid #e1e8e5;border-radius:16px;padding:0 18px}
.session summary{list-style:none;cursor:pointer;display:flex;align-items:start;gap:13px;padding:17px 0}
.session summary::-webkit-details-marker{display:none}
.session-index{font-size:11px;color:#7d9e84;font-weight:850;margin-top:2px;width:20px}
.session-main{flex:1;min-width:0}
.session-main strong{display:block;color:#253d36;font-size:14px;line-height:1.45}
.session-main .dose{display:block;font-size:11px;color:#657975;line-height:1.65;margin-top:4px}
.session-plus{font-size:20px;color:#71927c;line-height:1}
.session[open] .session-plus{transform:rotate(45deg)}
.session-body{padding:0 0 19px 33px;font-size:12px;color:#617774;line-height:1.8}
.optional{margin-top:9px;border:1px dashed #bbccc4;background:#f9fbfa}
.optional summary{padding:15px 0}
.wod{margin-top:22px;border-radius:20px;background:#e6f3dd;border:1px solid #d2e6ca;padding:24px}
.wod-label{font-size:10px;letter-spacing:.12em;font-weight:900;color:#53765b}
.wod h3{font-size:24px;letter-spacing:-.055em;line-height:1.2;margin:10px 0}
.wod strong{color:#2b4f37}.wod p{font-size:12px;color:#55705e;line-height:1.8;margin:9px 0 0}
.wod .wod-dose{font-size:14px;color:#2b4332;font-weight:750;line-height:1.7}
.hold{margin-top:13px;padding:12px 14px;border-radius:10px;background:#d5e9cc;color:#395b43;font-size:11px;line-height:1.8}
.overview{padding:22px 25px;border-radius:18px;background:#fff;border:1px solid #e1e8e5;margin-bottom:18px}
.overview h2{font-size:22px;letter-spacing:-.05em;margin:0 0 6px}.overview p{font-size:12px;color:#70817c;line-height:1.75;margin:0}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:20px 0}
.stat{background:#fff;border:1px solid #e1e8e5;border-radius:15px;padding:19px}
.stat b{font-size:30px;letter-spacing:-.075em;line-height:1.2;display:block}
.stat span{font-size:10px;color:#71857c}
.chart{background:#fff;border:1px solid #e1e8e5;border-radius:18px;padding:23px;margin-top:19px}
.chart h2{font-size:18px;letter-spacing:-.035em;margin:0}
.bars{display:flex;align-items:end;height:170px;gap:9px;margin-top:21px;border-bottom:1px solid #d7e1db;padding-bottom:5px}
.bar-outer{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;min-width:0}
.bar{width:100%;max-width:38px;background:#a6d6b7;border-radius:6px 6px 2px 2px;min-height:3px}

<script>
(function(){
"use strict";
const app=document.getElementById("app");
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const getSave=(key,fallback)=>{try{return localStorage.getItem(key)||fallback}catch{return fallback}};
const save=(key,val)=>{try{localStorage.setItem(key,val)}catch{}};
const state={data:null,screen:"roadmap",week:0,days:getSave("hyrox_days","5")==="6"?6:5};
const dshort=s=>String(s||"").slice(5).replace("-","/");
function countdown(){const t=new Date("2027-03-12T00:00:00+08:00").getTime()-Date.now();return Math.max(0,Math.ceil(t/86400000))}
function nav(tab){state.screen=tab;document.querySelectorAll("[data-tab]").forEach(b=>{const a=b.dataset.tab===tab;b.classList.toggle("active",a);b.setAttribute("aria-current",a?"page":"false")});app.innerHTML=tab==="roadmap"?roadmap():tab==="week"?weekPage():analysis();window.scrollTo({top:0,behavior:"instant"});if(history.replaceState)history.replaceState(null,"","#"+tab)}

function roadmap(){
 const s=state.data.seasonPlan,colors=["#67b791","#7aaed1","#b7a8e4","#e4b778","#7aa69a"];
 const groups=s.blocks.map((block,i)=>{
  const weeks=s.weeks.filter(w=>w.blockId===block.id);
  const list=weeks.map(w=>
   '<button class="simpl-week-row" data-week-open="'+(w.index-1)+'"><span class="simpl-week-id">'+esc(w.id)+'</span><span class="simpl-week-info"><strong>'+esc(w.focus)+'</strong><small>'+esc(dshort(w.start))+' – '+esc(dshort(w.end))+' · '+esc(w.weaknessFocus||'')+'</small></span><span class="simpl-arrow">›</span></button>'
  ).join('');
  return '<section class="simpl-phase"><div class="simpl-phase-head"><span class="simpl-phase-number" style="background:'+colors[i]+'">'+(i+1)+'</span><div><small>'+esc(block.dates)+'</small><h3>'+esc(block.name)+'</h3><p>'+esc(block.theme)+'</p></div></div><div class="simpl-week-list">'+list+'</div></section>';
 }).join('');
 return '<section class="screen active simpl-roadmap"><div class="simpl-hero"><span class="mini">HYROX · 17-WEEK PLAN</span><h1>17 週訓練路線</h1><p>每週有不同重點，循序加強增肌、Station心肺與HYROX組合。跑步另列自由加練；點選週次查看星期日到星期六課表。</p><div class="simpl-race">03/12 混雙　·　03/13 男單</div></div><h2 class="simpl-heading">五個階段</h2>'+groups+'</section>';
}
function cleanExercise(s){
 s=String(s||"").trim();
 if(/^(?:若|如|如果|本週Petra|Garmin|記錄|小腿有|小腿若|有症狀|任何膝蓋)/.test(s))return "";
 return s.split("；")[0].replace(/（[^）]*(?:不適|取消|Petra|改Bike|症狀|小腿|膝蓋)[^）]*）/g,"").trim();
}

const LABELS={station:"STATION CARDIO",strength:"STRENGTH",mixed:"HYROX WOD",optional:"OPTIONAL",rest:"REST",race:"RACE",run:"RUN"};
function renderDay(z,i){
 const sections=(z.sections||[]).map(g=>{
  const lines=(g.lines||[]).filter(x=>String(x||"").trim());
  return '<section class="simpl-session-group"><div class="simpl-group-head"><strong>'+esc(g.name||"課程")+'</strong><span class="simpl-group-meta">'+esc(g.format||"")+'</span></div><ul>'+lines.map(t=>'<li>'+esc(t)+'</li>').join("")+'</ul></section>';
 }).join('');
 const category=z.kind||"rest";
 return '<article class="simpl-day '+(category==="rest"?"simpl-rest":category==="optional"?"simpl-optional":"")+'">'+
 '<div class="simpl-day-head"><div class="simpl-day-date"><span>'+esc(z.dayZh||"")+'</span><small>'+esc(dshort(z.date||""))+'</small></div><div class="simpl-day-name"><strong>'+esc(z.title||"")+'</strong><span>'+esc(z.time||"")+'</span></div><span class="simpl-kind kind-'+esc(category)+'">'+esc(LABELS[category]||"CLASS")+'</span></div>'+
 sections+'</article>';
}
function renderRunning(w){
 const run=w.runningPlan||{};
 if(!Array.isArray(run.sessions)||!run.sessions.length)return '';
 return '<section class="simpl-running"><div class="simpl-days-title"><h2>跑步加練</h2><span>自行安排 · 不排固定日期</span></div>'+
 '<p class="simpl-running-intro">這是獨立的跑步建議，不屬於上方的 Station 心肺課。</p>'+
 '<div class="simpl-run-grid">'+run.sessions.map(x=>'<article class="simpl-run-card"><strong>'+esc(x.name||"")+'</strong><b>'+esc(x.dose||"")+'</b><ul>'+(x.steps||[]).map(t=>'<li>'+esc(t)+'</li>').join("")+'</ul></article>').join("")+'</div></section>';
}
function weekPage(){
 const s=state.data.seasonPlan,w=s.weeks[state.week],block=s.blocks.find(b=>b.id===w.blockId);
 const controls='<div class="week-controls"><button data-prev="'+state.week+'" '+(state.week===0?"disabled":"")+' aria-label="前一週">‹</button><select id="week-select" aria-label="選擇週次">'+s.weeks.map((z,i)=>'<option value="'+i+'"'+(state.week===i?' selected':'')+'>'+esc(z.id)+' · '+esc(dshort(z.start))+'–'+esc(dshort(z.end))+'</option>').join("")+'</select><button data-next="'+state.week+'" '+(state.week===16?"disabled":"")+' aria-label="下一週">›</button></div>';
 const days=(w.dailyPlan||[]).map(renderDay).join('');
 const isRace=w.id==="W17",p=w.periodization||{},balance=w.weeklyBalance||{};
 const sentence=isRace?"週五混雙、週六男單，其他日以短啟動與休息為主。":
 "每週 2 天力量主課、2 天 Station 心肺、1 天獨立 WOD；週四選配、週六休息。跑步單獨安排。";
 return '<section class="screen active simpl-week"><div class="simpl-week-top"><div><span class="mini">'+esc(block?.name||"")+'</span></div>'+controls+'</div>'+
 '<div class="simpl-week-hero"><span class="mini">'+esc(w.id)+' · '+esc(dshort(w.start))+' – '+esc(dshort(w.end))+' · SUN–SAT</span><h1>'+esc(w.focus)+'</h1>'+
 '<div class="simpl-emphasis"><b>本週側重</b><span>'+esc(p.weeklyRule||w.check||"")+'</span></div><p>'+esc(sentence)+'</p></div>'+
 '<div class="simpl-days-title"><h2>每天練什麼</h2><span>星期日 → 星期六</span></div><div class="simpl-days">'+days+'</div>'+
 renderRunning(w)+
 '<p class="simpl-bottom-note">週四可選擇上肢增肌或 Petra Strength／Skill；如已參加 Petra WOD，週五的 WOD 不重複做。持續的關節疼痛或腫脹應另行評估。</p></section>';
}

function analysis(){
 const d=state.data,m=d.metrics||{},list=d.weeklyKm||[],max=Math.max(28,...list.map(x=>Number(x.km)||0));
 const bars=list.map((x,i)=>{const val=Number(x.km)||0;return '<div class="bar-outer"><span class="bar-value">'+val.toFixed(1)+'</span><div class="bar '+(i===list.length-1?'bright':'')+'" style="height:'+Math.max(3,Math.round(val/max*120))+'px" title="'+esc(x.w)+' '+val+' km"></div><span class="bar-label">'+esc(x.w)+'</span></div>'}).join("");
 const findings=(d.coach?.findings||[]).slice(0,4).map((x,i)=>'<article class="insight"><span class="n">0'+(i+1)+'</span><h3>'+esc(x.title)+'</h3><p>'+esc(x.body)+'</p></article>').join("");
 const sources=(d.seasonPlan?.science||[]).map(x=>'<a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.title)+'</a>').join(' · ');
 return '<section class="screen active"><div class="overview"><span class="mini">TRAINING EVIDENCE / SNAPSHOT</span><h2>用實際紀錄，調整每一週。</h2><p>Garmin 與 Petra 負責紀錄實際訓練；這裡只顯示能影響課表的關鍵指標，不拿不相同的課程做誤導性比較。</p></div><div class="stat-grid"><div class="stat"><span>GARMIN 活動</span><b>'+esc(m.activities)+'</b></div><div class="stat"><span>累積跑步 KM</span><b>'+Number(m.totalKm||0).toFixed(1)+'</b></div><div class="stat"><span>PETRA 照片</span><b>'+esc(m.petraPhotos)+'</b></div></div><article class="chart"><h2>每週跑量</h2><p class="lead" style="font-size:11px">截至 '+esc(d.dataThrough)+'；最新週尚未結束。11/02 的 25.84 km 高於先前常態，後續不應盲目追加跑量。</p><div class="bars">'+bars+'</div></article><div class="section-head"><h2>AI 教練怎麼判讀</h2><p>分析日期 '+esc(d.lastReview)+'</p></div><div class="insights">'+findings+'</div><div class="section-head"><h2>小腿恢復 · 11/12 間歇後</h2></div><div class="overview"><p>'+esc(d.calfRecovery?.symptom||'')+'</p><p style="margin-top:12px"><b>下次強度課前先確認：</b>步行與上樓是否正常、提踵是否舒適、隔天有沒有加重。仍痛就改低衝擊Easy，避免把酸痛直接診斷成肌耐力不足。</p></div><div class="section-head"><h2>資料與系統</h2></div><div class="status-grid"><div class="status-line"><span>Garmin 同步快照</span><small>'+esc(d.lastSync||'—')+'</small></div><div class="status-line"><span>Petra 歷史索引</span><small>'+esc(m.petraPhotos||'—')+' 張／已分析的快照</small></div><div class="status-line"><span>AI 課表更新</span><small>'+esc(d.lastReview||'—')+'</small></div><div class="status-line"><span>完整17週方案</span><small>V'+esc(d.version||'—')+' · 每週依新資料微調</small></div></div><div class="sources">參考研究：'+sources+'</div></section>'
}
document.addEventListener("click",e=>{
 const tab=e.target.closest("[data-tab]");if(tab){nav(tab.dataset.tab);return}
 const wk=e.target.closest("[data-week-open]");if(wk){state.week=Number(wk.dataset.weekOpen);nav("week");return}
 const prev=e.target.closest("[data-prev]");if(prev){state.week=Math.max(0,state.week-1);nav("week");return}
 const next=e.target.closest("[data-next]");if(next){state.week=Math.min(state.data.seasonPlan.weeks.length-1,state.week+1);nav("week");return}
});
document.addEventListener("change",e=>{
 if(e.target.id==="week-select"){state.week=Number(e.target.value);nav("week")}
});
async function load(){
 try{
  const res=await fetch("./data/report.json?t="+Date.now(),{cache:"no-store"});
  if(!res.ok)throw new Error("HTTP "+res.status);
  const d=await res.json();
  if(!Array.isArray(d.seasonPlan?.weeks)||d.seasonPlan.weeks.length!==17)throw new Error("17週課表未完成");
  state.data=d;
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const datePart=k=>parts.find(x=>x.type===k)?.value||"00";const today=datePart("year")+"-"+datePart("month")+"-"+datePart("day"); const closest=d.seasonPlan.weeks.findIndex(w=>today<=w.end);state.week=closest>=0?closest:d.seasonPlan.weeks.length-1;
  document.getElementById("update-stamp").textContent="PLAN "+(d.planUpdated||"—")+" · DATA "+(d.dataThrough||"—");
  const hash=location.hash.replace("#","");
  nav(["roadmap","week","analysis"].includes(hash)?hash:"roadmap");
 }catch(err){
  app.innerHTML='<div class="overview" style="margin-top:32px"><h2>暫時讀不到訓練計畫</h2><p>'+esc(err.message)+'。請確認網路後重新整理；離線時可嘗試重新打開已快取的App。</p></div>';
 }
}
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js?v=18").catch(()=>{})}
load();
})();
</script>
