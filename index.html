<style>
:root{color-scheme:dark;--bg:#10141c;--panel:#1b2130;--panel2:#232a38;--text:#f5f3ee;--muted:#98a1af;--dim:#6a7485;--border:#313a48;--accent:#ff704e;--accent2:#ffb28a;--mint:#abf0d1;--sky:#a9c6ff;--radius:20px;--shadow:0 12px 40px rgba(0,0,0,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang TC','Noto Sans TC',system-ui,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}a{color:inherit;text-decoration:none}p{margin:0}b,strong{font-weight:780}.mono{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}

function hero(d){const countdown=Math.max(0,Math.round((Date.parse('2027-03-13T12:00:00Z')-Date.parse(isoToday()+'T12:00:00Z'))/86400000));return `<div class="intro"><div class="crumb">ALVIN · RACE PREP / 2027</div><div class="top-split"><div><h1 class="page-title">用得上的訓練。<br>跑得完的比賽。</h1><p class="subline">週五混雙不透支，週六男單穩穩完賽。Sub-90 當成額外挑戰。</p></div><div style="text-align:right;flex-shrink:0"><div class="mono" style="font-size:clamp(37px,5vw,55px);font-weight:920;color:var(--accent);letter-spacing:-.08em;line-height:1">${countdown}</div><div class="kicker">DAYS TO RACE</div></div></div><div class="racedays"><div class="racechip"><strong>03.12 FRI</strong> MIXED / STACY</div><div class="racechip"><strong>03.13 SAT</strong> MEN'S OPEN</div></div></div>`}
function recent(d){let r=d.recentWorkout;if(!r)return '';return `<div class="section"><div class="sectionline"><h2 class="section-title">最近練了什麼</h2><button type="button" class="actionlink" data-jump="insights">看 Garmin 分析 ↗</button></div><div class="card recent-card"><div><div class="crumb">${E(r.date)} · WORLD GYM</div><h3>${E(r.session)}</h3><p>${(r.movements||[]).map(E).join('　·　')}</p></div><div class="recent-metric"><b class="accent-txt mono">${E(r.garmin?.wallBallAvgHr||'—')}</b><span>WALL BALL HR<br>平均 / BPM</span></div></div></div>`}
function todayScreen(d){const n=nextSession(d),c=coachPriority(d),s=d.metrics||{},status=String(d.lastSync||d.dataThrough||'—');return `<section class="screen active" id="screen-today">${hero(d)}<div class="today-grid"><article class="card next-card"><div class="next-top"><span class="tiny">NEXT UP / YOUR PLAN</span><span class="datepill mono">${E(fullDate(n.when))}</span></div><div><h2 class="next-title">${E(n.title)}</h2><p class="next-desc">${E(n.desc)}</p></div><div class="next-bottom"><span class="arrowcircle">↗</span><span>${E(kinds[n.kind]||'訓練')} · 依恢復程度調整</span></div></article><aside class="card why-card"><div><span class="why-chip">COACH'S CALL · THIS WEEK</span><h3>${E(c.head)}</h3><p>${E(c.body)}</p></div><div class="why-footer"><b>提醒</b>　不能把每次 Petra 高強度和 World Gym 站點都疊滿。</div></aside></div><div class="section"><div class="sectionline"><h2 class="section-title">訓練快照</h2><div class="section-note">報告截至 ${E(d.dataThrough||d.updated)}</div></div><div class="mini-grid"><article class="card mini"><label>上週／最新跑量</label><b class="mono">${Number(s.recentWeekKm||0).toFixed(1)}<span style="font-size:12px;font-weight:600"> km</span></b><small>最新週可能不完整</small></article><article class="card mini"><label>400m 工作段</label><b class="mono">${fmtSeconds(s.intervalAvgSeconds)}</b><small>11/05 · 8 趟平均</small></article><article class="card mini"><label>1,500m ROW</label><b class="mono">${E(s.row1500||'—')}</b><small>Garmin 測試值</small></article></div></div>${recent(d)}<div class="health"><button class="health-toggle" data-health="1" aria-expanded="false">系統資料健康檢查 <span>展開 ＋</span></button><div class="health-body" id="health-body" hidden>${health(d)}</div></div></section>`}
function health(d){const asof=d.reviewStatus?.garminLastSyncUtc||'';const photo=d.reviewStatus?.petraPhotoAsOf||'2026-11-04';return `<div class="health-row"><span>Garmin API / Google Sheet</span><b><em>✓</em> ${E(d.lastSync||asof||'已連接')}</b></div><div class="health-row"><span>Petra 增量照片</span><b>${E(String(d.metrics?.petraPhotos||'—'))} 已索引 · ${E(photo)}</b></div><div class="health-row"><span>AI 訓練分析</span><b>${E(d.lastReview||d.updated||'—')}</b></div><div class="health-row"><span>Web App 報告</span><b>v${E(d.version||'?')}</b></div><p style="font-size:10px;color:var(--dim);line-height:1.7;margin-top:11px">這是報告產製時的健康狀態，不是即時線上監控。每週日教練任務是否成功請以該次結果為準。</p>`}
function barChart(weeks){const mx=Math.max(22,...weeks.map(w=>Number(w.km)||0));return `<div class="chart-axis" role="img" aria-label="${weeks.length} 週跑量柱狀圖">${weeks.map((w,i)=>`<div class="barcol"><span class="barval mono">${Number(w.km).toFixed(1)}</span><div class="barblock ${i===weeks.length-1?'last':''}" style="height:${Math.max(3,(Number(w.km)||0)/mx*120)}px"></div><span class="barlabel">${E(w.w)}</span></div>`).join('')}</div>`}
function insightsScreen(d){const m=d.metrics||{},f=d.coach?.findings||[],e=m.easyPrior||{},r=d.recentWorkout||{},i=d.intervals||[];return `<section class="screen" id="screen-insights"><div class="intro"><div class="crumb">TRAINING INTELLIGENCE / 01</div><h1 class="page-title">看懂進步，而不是<br>堆數字。</h1><p class="subline">比速度更重要的，是能否在 Sled、Wall Ball 之後重新跑起來。</p></div><div class="metric-grid"><div class="card stat"><label>Garmin 累積跑量</label><b class="mono">${Number(m.totalKm||0).toFixed(1)} <span style="font-size:12px">km</span></b><small>${E(m.runs||0)} 筆跑步（含熱身）</small></div><div class="card stat"><label>最近 Easy Run</label><b class="mono">${E(m.lastEasyPace||'—')}</b><small>${E(m.lastEasyHr)} bpm · ${E(m.lastEasyDistance)}km</small></div><div class="card stat"><label>Petra 白板</label><b class="mono">${E(m.petraPhotos||0)}</b><small>張原始白板，非出席堂數</small></div><div class="card stat"><label>11/7 Wall Ball</label><b class="mono">${E(r.garmin?.wallBallAvgHr||'—')} <span style="font-size:12px">bpm</span></b><small>平均，最高 ${E(r.garmin?.wallBallMaxHr||'—')} bpm</small></div></div><div class="chart-grid"><div class="card chart-pad"><div class="chart-title">跑步耐力底盤</div><div class="chart-note">每週跑量 · KM · 不重複計入 WOD 估算</div>${barChart(d.weeklyKm||[])}<p class="plotfoot">最新週 ${Number(m.recentWeekKm||0).toFixed(1)}km；此前多在 12–16km。先觀察疲勞與低心率表現，再考慮漸進加量。</p></div><div class="card chart-pad"><div class="chart-title">400m 間歇｜速度有餘裕</div><div class="chart-note">FIT 工作段，不能當同條件的進步測試</div><div class="splits">${i.map(x=>`<div class="split"><div><div class="date">${E(x.date)} · ${E(x.label)}</div><div class="meta">${E(x.reps)} 趟 · HR ${E(x.avgHr)} bpm</div></div><div class="time mono">${fmtSeconds(x.avgSec)}</div></div>`).join('')}</div><p class="warningtext">11/05 包含 200m 快／慢跑轉換與 8 趟 400m；不要只因 1:42 比 2:00 快，就推論長距離耐力已提升。</p></div></div><div class="section"><div class="sectionline"><h2 class="section-title">AI 教練判讀</h2><span class="section-note">教練復盤 ${E(d.lastReview||d.updated)}</span></div><div class="insight-hero"><span class="crumb">THE MOST IMPORTANT THING</span><h3>${E(d.coach?.headline||'逐步建立耐力與力量')}</h3><p>${E(d.coach?.summary||'')}</p></div><div class="finding-list">${f.map((x,idx)=>`<article class="card finding"><span class="finding-index">0${idx+1} / FINDING</span><strong>${E(x.title)}</strong><p>${E(x.body)}</p></article>`).join('')}</div><p class="plotfoot">資料界線：${E(d.coach?.limitation||'')}</p></div><div class="section"><div class="sectionline"><h2 class="section-title">Petra · 近期證據</h2></div><div class="source-row">${(d.petra||[]).map(x=>`<article class="source-tile"><div class="name">${E(x.date)} · ${E(x.name)}</div><b class="mono">${E(x.score)}</b><p>${E(x.detail)}</p></article>`).join('')}</div></div></section>`}
function rowDay(row){const [day,title,desc,type]=row;return `<div class="day"><span class="dow">${E(day)}</span><div><span class="type ${E(type)}">${E(kinds[type]||type)}</span><div class="day-title">${E(title)}</div><p>${E(desc)}</p></div></div>`}
function weekHtml(d,i){const w=d.weeks[i];return `<div class="planhead"><div><div class="kicker">${E(w.dates)} · ${E(w.week)}</div><h3>${E(w.tag)}</h3></div><div class="runpill">${E(w.km)}</div></div><p class="goalnote">本週焦點：${E(w.focus)}</p><div class="days">${w.days.map(rowDay).join('')}</div><div class="tip">強度選擇原則：週三 Petra WOD 若已高強度，週四 Interval 改 Easy；若週末腿仍疲勞，硬拉減組或取消，其他站點也不強迫加。</div>`}
function planScreen(d){return `<section class="screen" id="screen-plan"><div class="intro"><div class="crumb">THE PLAN / 02</div><h1 class="page-title">未來四週。<br>照著做，適時調整。</h1><p class="subline">三大項是底盤；Petra 練技巧與心肺；World Gym 的 Sled、SkiErg、RowErg 只是需要時才加入。</p></div><div class="weeknav" role="group" aria-label="選擇週次">${(d.weeks||[]).map((w,i)=>`<button type="button" class="weekbtn" data-week="${i}" aria-pressed="false"><b>${E(w.week)} · ${E(w.tag)}</b><small>${E(w.dates)}</small></button>`).join('')}</div><div class="card week-view" id="week-view" aria-live="polite">${weekHtml(d,0)}</div><div class="section"><div class="sectionline"><h2 class="section-title">World Gym · 三大項</h2><span class="section-note">展開看完整動作</span></div><div class="lifts-grid">${(d.lifts||[]).map(x=>`<details class="card lift"><summary><span class="letter">${E(x.id)}</span><b>${E(x.name)}</b><small>＋</small></summary><ul>${(x.movements||[]).map(t=>`<li>${E(t)}</li>`).join('')}</ul></details>`).join('')}</div></div><div class="section"><div class="sectionline"><h2 class="section-title">直到比賽日</h2></div><div class="roadmap">${(d.phases||[]).map(x=>`<article class="card phase"><span>${E(x.dates)}</span><b>${E(x.head)}</b><p>${E(x.detail)}</p></article>`).join('')}</div></div></section>`}
function renderWeek(i){if(!report||!report.weeks?.[i])return;selectedWeek=i;document.getElementById('week-view').innerHTML=weekHtml(report,i);document.querySelectorAll('[data-week]').forEach(btn=>{const active=Number(btn.dataset.week)===i;btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active))});}
function pickCurrentWeek(d){const now=isoToday();const ws=parseWeeks(d);let idx=ws.findIndex(w=>w.start&&now>=w.start&&now<isoPlus(w.start,7));if(idx<0)idx=ws.findIndex(w=>w.start&&w.start>now);return idx>=0?idx:Math.max(0,ws.length-1)}
function openTab(id){if(!['today','insights','plan'].includes(id))id='today';document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('active',el.id==='screen-'+id));document.querySelectorAll('[data-tab]').forEach(btn=>{btn.classList.toggle('active',btn.dataset.tab===id);btn.setAttribute('aria-current',btn.dataset.tab===id?'page':'false')});if(history.replaceState)history.replaceState(null,'','#'+id);window.scrollTo({top:0,behavior:'instant'});}
function render(d){if(!d||!Array.isArray(d.weeks)||!d.metrics||!d.coach)throw Error('Report schema invalid');report=d;document.getElementById('head-sync').textContent='REVIEW · '+String(d.lastReview||d.updated||'—');document.getElementById('app').innerHTML=todayScreen(d)+insightsScreen(d)+planScreen(d);renderWeek(pickCurrentWeek(d));const tab=location.hash.slice(1);openTab(['today','insights','plan'].includes(tab)?tab:'today');document.querySelectorAll('[data-week]').forEach(b=>b.addEventListener('click',()=>renderWeek(Number(b.dataset.week))));document.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>openTab(b.dataset.jump)));const health=document.querySelector('[data-health]');if(health)health.addEventListener('click',()=>{let panel=document.getElementById('health-body');panel.hidden=!panel.hidden;health.setAttribute('aria-expanded',String(!panel.hidden));health.querySelector('span').textContent=panel.hidden?'展開 ＋':'收合 −';});}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>openTab(b.dataset.tab)));
window.addEventListener('hashchange',()=>{if(report){const id=location.hash.slice(1);if(['today','insights','plan'].includes(id))openTab(id)}});
fetch('./data/report.json?v='+Date.now(),{cache:'no-store'}).then(x=>{if(!x.ok)throw Error('HTTP '+x.status);return x.json()}).then(render).catch(e=>{console.warn('HYROX report unavailable',e);document.getElementById('head-sync').textContent='OFFLINE';document.getElementById('app').innerHTML='<div class="error">目前無法載入最新訓練報告。請檢查網路後重新開啟 App；首次使用必須先連線。</div>'});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=7').catch(()=>{}));
</script></body></html>
