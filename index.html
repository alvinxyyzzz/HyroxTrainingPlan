async function load(){const paths=["./data/coaching-v156.json","./data/season-ui.json","./data/latest-garmin.json","./data/performance.json"];const r=await Promise.allSettled(paths.map(get));state.coach=r[0].status==="fulfilled"?r[0].value:null;state.plan=r[1].status==="fulfilled"?r[1].value:null;state.latest=r[2].status==="fulfilled"?r[2].value:null;state.performance=r[3].status==="fulfilled"?r[3].value:null;if(!Array.isArray(state.plan)||state.plan.length!==17){app.innerHTML=card("<h2>訓練週期暫時無法讀取</h2><p>請重新整理或確認網路。</p>");return}if(!state.coach?.weeks){state.error.push("詳細處方暫時無法讀取，請重新整理");app.innerHTML=card("<h2>詳細處方暫時無法讀取</h2><p>不使用過期課表替代。請重新整理。</p>");return}if(!state.latest)state.error.push("Garmin 摘要暫時不可用");state.today=today();state.week=current();$("#stamp").textContent="UI 3.0 · "+state.coach.version+" / "+(state.latest?.dataThrough||"無快照");nav(location.hash.slice(1))}
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js?v=51").catch(()=>{});load();
})();
</script></body></html>
