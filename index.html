<script>
'use strict';
const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const tpe={skill:'技巧',strength:'力量',run:'品質跑',easy:'Easy',rest:'恢復',conditional:'彈性'};
const today=(()=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const d=Object.fromEntries(p.filter(z=>z.type!=='literal').map(z=>[z.type,z.value]));return `${d.year}-${d.month}-${d.day}`})();
const plus=(s,n)=>{let d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
function weekStarts(data){let year=Number((data.updated||'2026-11-07').slice(0,4));const baseMonth=Number((data.updated||'2026-11-07').slice(5,7));let prev=0;return (data.weeks||[]).map((w,i)=>{const m=String(w.dates).match(/(\d{1,2})\/(\d{1,2})/);if(!m)return null;let mon=+m[1];if(i===0&&mon<baseMonth-6)year++;if(i>0&&prev&&mon<prev-6)year++;prev=mon;return `${year}-${String(mon).padStart(2,'0')}-${m[2].padStart(2,'0')}`})}
function activeWeek(d){const s=weekStarts(d);let n=s.findIndex(w=>w&&today>=w&&today<plus(w,7));if(n===-1)n=s.findIndex(w=>w&&w>today);return n===-1?-1:n}
function nextWork(d){const starts=weekStarts(d);for(let i=0;i<starts.length;i++){const st=starts[i];if(!st)continue;for(let j=0;j<7;j++){const day=plus(st,j);if(day>=today){return {day,week:i,idx:j,row:d.weeks[i]?.days?.[j]}}}}return null}
function fmt(sec){sec=Math.round(Number(sec)||0);return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
let report=null,selectedWeek=0;
const raceDays=Math.max(0,Math.round((Date.parse('2027-03-13T12:00:00Z')-Date.parse(today+'T12:00:00Z'))/86400000));
function nextLabel(n){if(!n)return '本期計畫待更新';return n.day===today?'今日訓練':'下一堂 · '+n.day.slice(5).replace('-','/')}
function dayColor(t){return tpe[t]?t:'conditional'}
function weekstrip(d,wi){const days=d.weeks?.[wi]?.days||[];const start=weekStarts(d)[wi];return `<div class="weekstrip">${days.map((r,j)=>`<div class="d ${esc(dayColor(r[3]))} ${start&&plus(start,j)===today?'active':''}"><strong>${esc(r[0])}</strong><b>${start?plus(start,j).slice(-2):'—'}</b><span aria-label="${esc(tpe[r[3]]||r[3])}"></span></div>`).join('')}</div>`}
function todayScreen(d){const n=nextWork(d),r=n?.row;const rec=d.recentWorkout;let wk=n?.week??activeWeek(d);if(wk<0)wk=d.weeks.length-1;const coach=d.coach||{};return `<section class="screen on" id="screen-today"><div class="campaign"><div><div class="mini"><span class="edition">RACE CAMPAIGN 27</span><span class="eyebrow">TAIPEI / MARCH 12–13</span></div><h1 class="h1">為第二場<br><span>保留實力。</span></h1><p>不是只拚週五混雙的速度，而是週六男單也能穩定跑過終點。</p><div class="race-pair"><span><strong>FRI 12</strong>MIXED DOUBLES</span><span><strong>SAT 13</strong>MEN'S OPEN</span></div></div><div class="countdown"><b class="mono">${raceDays}</b><span>DAYS TO RACE</span></div></div><div class="today-grid"><article class="card workout-feature"><div class="work-top"><span class="label">${r?'YOUR NEXT SESSION':'PLAN STATUS'}</span><span class="daydate">${esc(nextLabel(n))}</span></div><h2>${r?esc(r[1]):'下一輪課表待更新'}</h2><p>${r?esc(r[2]):'目前四週課表已過期。請以恢復和低強度活動為主，下一次週報確認更新後再進階。'}</p><div class="work-actions"><button class="btn-primary" type="button" data-jump="program">查看本週課表 <span aria-hidden="true">↗</span></button><span class="smallmeta">${r?esc(tpe[r[3]]||r[3]):'WAITING FOR REVIEW'}</span></div></article><aside class="card coach-card"><div><div class="index">COACH'S DECISION / THIS WEEK</div><h3>${esc(coach.headline||'穩定輸出，比單次爆發更重要')}</h3><p>${esc((coach.findings||[])[0]?.body||coach.summary||'')}</p></div><div class="footerline"><span style="width:6px;height:6px;border-radius:50%;background:#29745d"></span>按 Petra 負荷動態調整；不是固定死課表</div></aside></div><div class="section"><div class="section-top"><h2>接下來七天</h2><small>${esc(d.weeks?.[wk]?.dates||'')}</small></div>${weekstrip(d,wk)}</div>${rec?`<div class="section"><div class="section-top"><h2>上一堂，學到什麼？</h2><small>${esc(rec.date)} · WORLD GYM</small></div><div class="recent"><div class="card recent-main"><span class="eyebrow">SESSION DEBRIEF / VERIFIED PARTIALLY</span><h3>${esc(rec.session)}</h3><p>${esc(rec.interpretation||'')}</p><div class="recent-spec">${(rec.movements||[]).map(z=>`<span>${esc(z)}</span>`).join('')}</div></div><div class="card recent-side"><span class="micro">WALL BALL / AVG HR</span><strong class="mono">${esc(rec.garmin?.wallBallAvgHr||'—')}<span style="font-size:14px;letter-spacing:0"> bpm</span></strong><p>最高 ${esc(rec.garmin?.wallBallMaxHr||'—')} bpm。這是心率，不代表球數或技術品質。</p></div></div></div>`:''}${healthPanel(d)}</section>`}
function chart(weeks){const max=Math.max(22,...weeks.map(w=>Number(w.km)||0));return `<div class="histogram" role="img" aria-label="每週跑量圖表，單位公里">${weeks.map((w,i)=>`<div class="barwrap"><div class="num mono">${(Number(w.km)||0).toFixed(1)}</div><div class="hist ${i===weeks.length-1?'latest':''}" style="height:${Math.max(4,Number(w.km)/max*142)}px"></div><div class="weekname">${esc(w.w)}</div>${w.partial?'<div class="partial">部分</div>':''}</div>`).join('')}</div>`}
function progressScreen(d){const m=d.metrics||{},ints=d.intervals||[],findings=d.coach?.findings||[];return `<section class="screen" id="screen-progress"><div class="intro"><div><span class="eyebrow">01 / TRAINING INTELLIGENCE</span><h1>看證據，<br>不看感覺。</h1><p>數據真正的價值，是讓下週的訓練決策更準確。</p></div><span class="pill"><i></i>資料截至 ${esc(d.dataThrough||d.updated)}</span></div><div class="kpis"><div class="card kpi"><small>最近週跑量</small><b class="mono">${Number(m.recentWeekKm||0).toFixed(1)} <span>km</span></b><p>未完整週，包含熱身</p></div><div class="card kpi"><small>最近 Easy Run</small><b class="mono">${esc(m.lastEasyPace||'—')}</b><p>平均心率 ${esc(m.lastEasyHr||'—')} bpm</p></div><div class="card kpi"><small>1,500m Row</small><b class="mono">${esc(m.row1500||'—')}</b><p>Garmin；白板 ${esc(m.row1500Photo||'—')}</p></div><div class="card kpi"><small>累計跑量</small><b class="mono">${Number(m.totalKm||0).toFixed(1)} <span>km</span></b><p>${esc(m.runs||'—')} 筆 Garmin 跑步</p></div></div><div class="section graph-grid"><article class="card graph"><h3>週跑量趨勢</h3><p class="explain">Garmin 有記錄的活動；不重複估計 Petra WOD 距離</p>${chart(d.weeklyKm||[])}<p class="graphfoot">最後一根為未完整週。距離增加不代表當週一定恢復良好，要配合疲勞、睡眠與 Easy Run 心率。</p></article><article class="card graph"><h3>400m / 品質跑</h3><p class="explain">保留不同課表條件，避免錯誤比較</p><div class="interval-compare">${ints.map(z=>`<div class="item"><div><strong>${esc(z.date)} · ${esc(z.label)}</strong><p>${esc(z.reps)} 趟 · 平均 HR ${esc(z.avgHr)} bpm</p></div><b class="mono">${fmt(z.avgSec)}</b></div>`).join('')}</div><p class="graphfoot">8 趟與 12 趟不是同條件測驗。比速度更重要的是高負荷站點後仍能穩定跑。</p></article></div><div class="section"><div class="section-top"><h2>AI 教練判讀</h2><small>復盤 ${esc(d.lastReview||d.updated)}</small></div><div class="editorial"><span class="eyebrow">THE BIG PICTURE</span><h3>${esc(d.coach?.headline||'穩定、漸進、可持續')}</h3><p>${esc(d.coach?.summary||'')}</p></div><div class="findings">${findings.map((f,i)=>`<article class="card finding"><span class="idx">0${i+1} / INSIGHT</span><h3>${esc(f.title)}</h3><p>${esc(f.body)}</p></article>`).join('')}</div><p class="graphfoot">資料限制：${esc(d.coach?.limitation||'')}</p></div><div class="section"><div class="section-top"><h2>Petra · 近期佐證</h2><small>歷史照片增量讀取</small></div><div class="source-list">${(d.petra||[]).map(z=>`<article class="card source"><small>${esc(z.date)} · ${esc(z.name)}</small><strong>${esc(z.score)}</strong><p>${esc(z.detail)}</p></article>`).join('')}</div></div>${healthPanel(d)}</section>`}
function weekDays(d,i){const w=d.weeks[i];const start=weekStarts(d)[i];return `<div class="weekly-head"><div><span class="eyebrow">${esc(w.week)} / ${esc(w.dates)}</span><h2>${esc(w.tag)}</h2><p>${esc(w.focus)}</p></div><span class="volume">${esc(w.km)}</span></div><div class="daylist">${w.days.map((x,j)=>`<details class="dayentry" ${start&&plus(start,j)===today?'open':''}><summary><span class="dayname">${esc(x[0])}</span><div class="wrap"><b>${esc(x[1])}</b><small><span class="type-dot ${esc(dayColor(x[3]))}"></span>${esc(tpe[x[3]]||x[3])}${start?' · '+plus(start,j).slice(5).replace('-','/'):''}</small></div><span class="expand">＋</span></summary><div class="detail">${esc(x[2])}</div></details>`).join('')}</div><div class="weekly-tip"><strong>自動調整原則：</strong>週三 Petra 已達高強度，週四 Interval 換 Easy；腿尚未恢復，深蹲或硬拉減組，不強迫補滿 Station。</div>`}
function programScreen(d){return `<section class="screen" id="screen-program"><div class="intro"><div><span class="eyebrow">02 / YOUR TRAINING BLOCK</span><h1>按計畫練，<br>也要懂得變通。</h1><p>四週安排、三大項模板、直到比賽日的階段重點。</p></div><span class="pill warn">穩定完賽優先</span></div><div class="weeknav" role="group" aria-label="選擇週次">${d.weeks.map((w,i)=>`<button type="button" data-week="${i}"><b>${esc(w.week)} / ${esc(w.tag)}</b><small>${esc(w.dates)}</small></button>`).join('')}</div><div class="card weekly-card" id="weekly-card" aria-live="polite"></div><div class="section"><div class="section-top"><h2>World Gym · 三大項</h2><small>需要時展開動作</small></div><div class="lift-grid">${(d.lifts||[]).map(l=>`<details class="card lift"><summary><span class="letter">${esc(l.id)}</span><strong>${esc(l.name)}</strong><span class="plus">＋</span></summary><ul>${(l.movements||[]).map(z=>`<li>${esc(z)}</li>`).join('')}</ul></details>`).join('')}</div></div><div class="section"><div class="section-top"><h2>Road to Taipei</h2><small>長期週期化</small></div><div class="roadmap">${(d.phases||[]).map(z=>`<div class="card phase"><span class="phase-date">${esc(z.dates)}</span><strong>${esc(z.head)}</strong><p>${esc(z.detail)}</p></div>`).join('')}</div></div>${healthPanel(d)}</section>`}
function healthPanel(d){return `<div class="health"><details><summary>系統與資料狀態 <span class="arrow">＋</span></summary><div class="health-items"><span><strong>Garmin 報告快照</strong>${esc(d.lastSync||'尚無最近同步資訊')} · 當時 ${esc(d.metrics?.activities||'—')} 筆活動（非即時）</span><span><strong>Petra → Drive</strong>${esc(d.metrics?.petraPhotos||'—')} 張歷史照片 · 新照片採增量檢查</span><span><strong>AI 教練復盤</strong>${esc(d.lastReview||'待驗證')} · 每週排程不等於即時刷新</span><span><strong>網站報告</strong>V${esc(d.version||'—')} · 本頁是公開彙總報告，沒有 GPS 或 Key</span></div></details></div><footer class="foot"><span>HYROX LAB / ALVIN · 訓練判讀不是醫療診斷 · 來源：Garmin / Petra / 本人回報</span><a href="https://github.com/alvinxyyzzz/HyroxTrainingPlan" target="_blank" rel="noopener">GitHub 原始檔</a></footer>`}
function renderWeek(i){if(!report?.weeks?.[i])return;selectedWeek=i;document.querySelector('#weekly-card').innerHTML=weekDays(report,i);document.querySelectorAll('[data-week]').forEach(el=>{const on=Number(el.dataset.week)===i;el.classList.toggle('on',on);el.setAttribute('aria-pressed',String(on))})}
function openTab(id){if(!['today','progress','program'].includes(id))id='today';document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('on',el.id==='screen-'+id));document.querySelectorAll('[data-tab]').forEach(el=>{const v=el.dataset.tab===id;el.classList.toggle('on',v);el.setAttribute('aria-current',v?'page':'false')});if(history.replaceState)history.replaceState(null,'','#'+id);window.scrollTo({top:0,behavior:'instant'})}
function render(d){if(!Array.isArray(d?.weeks)||!d.metrics||!d.coach)throw Error('invalid report schema');report=d;document.getElementById('sync-stamp').textContent='REVIEW '+(d.lastReview||d.updated||'—');document.getElementById('app').innerHTML=todayScreen(d)+progressScreen(d)+programScreen(d);const ai=activeWeek(d);renderWeek(ai>=0?ai:d.weeks.length-1);const target=location.hash.slice(1);openTab(['today','progress','program'].includes(target)?target:'today');document.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>openTab(b.dataset.jump)));document.querySelectorAll('[data-week]').forEach(b=>b.addEventListener('click',()=>renderWeek(+b.dataset.week)))}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>openTab(b.dataset.tab)));
window.addEventListener('hashchange',()=>{if(report){let id=location.hash.slice(1);if(['today','progress','program'].includes(id))openTab(id)}});
fetch('./data/report.json?rev='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(render).catch(e=>{console.error('HYROX report error',e);document.getElementById('sync-stamp').textContent='DATA UNAVAILABLE';document.getElementById('app').innerHTML='<div class="error">目前無法讀取最新報告。請確認網路後重新開啟；首次使用需先連線。</div>'});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=8').catch(()=>{}));
</script>
</body></html>
